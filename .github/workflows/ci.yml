jobs:
  test-offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (offline)
        env:
          SKIP_LOAD_MARKETS: '1'
          DATA_FETCHER_SKIP_LOAD_MARKETS: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python -m pytest -q
      - name: Run debug wrapper (offline)
        env:
          SKIP_LOAD_MARKETS: '1'
          DATA_FETCHER_SKIP_LOAD_MARKETS: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python scripts/tools/run_all_debug_tests.py

  integration-on-demand:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test-offline
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integration test for perpetual symbol
        env:
          RUN_INTEGRATION_TESTS: '1'
          PYTHONIOENCODING: 'utf-8'
          # If testing with real KuCoin access, provide KUCOIN_API_KEY / secrets
        run: |
          python -m pytest -q tests/test_fetcher_perpetual_symbols.py
